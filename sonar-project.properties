# SonarCloud (Automatic Analysis). Keep in sync with the GitHub org/project key.
sonar.organization=happysuyeun-rgb
sonar.projectKey=happysuyeun-rgb_plan_os

# Migration history intentionally redefines CREATE OR REPLACE functions across
# 022→023→024 (and similar G1 hardenings). That duplicate density is required
# for append-only, re-runnable SQL history and must not fail the quality gate.
# Product/application TypeScript and tests remain fully under CPD.
sonar.cpd.exclusions=supabase/migrations/**,supabase/drafts/**

# Disposable local fixtures and seed SQL are not shipped product code.
sonar.exclusions=**/node_modules/**,**/dist/**,**/.vercel/**
