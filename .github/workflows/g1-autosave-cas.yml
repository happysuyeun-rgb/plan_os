name: G1 autosave CAS integration
on:
  pull_request:
    paths:
      - 'src/lib/documentAutosave.ts'
      - 'src/lib/api/documents.ts'
      - 'src/store/documentStore.ts'
      - 'tests/g1-autosave-cas.test.mjs'
      - '.github/workflows/g1-autosave-cas.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/g1-autosave-cas.test.mjs
      - run: npm run build
      - run: node node_modules/eslint/bin/eslint.js src/lib/documentAutosave.ts src/lib/api/documents.ts src/store/documentStore.ts
