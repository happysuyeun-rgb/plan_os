name: F401 Chromium browser E2E
on:
  pull_request:
    paths:
      - 'src/pages/HumanPmPlanDraftPage.tsx'
      - 'src/store/projectStore.ts'
      - 'src/App.tsx'
      - 'tests/f401-browser-e2e.mjs'
      - '.github/workflows/f401-browser-e2e.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder
      VITE_F401_E2E_FIXTURE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Run F401 isolated Chromium smoke
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/planos-f401-vite.log 2>&1 &
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then break; fi
            sleep 1
          done
          node tests/f401-browser-e2e.mjs
