name: PM plan approval local E2E disposable

on:
  pull_request:
    paths:
      - 'src/pages/PmPlan*.tsx'
      - 'src/pages/DashboardPage.tsx'
      - 'src/lib/api/pmPlans.ts'
      - 'src/lib/pmPlanLabels.ts'
      - 'src/lib/humanPmPlanDraft.ts'
      - 'supabase/migrations/022_pm_plan_review_loop.sql'
      - 'supabase/migrations/023_pm_plan_integrity_hardening.sql'
      - 'supabase/migrations/024_pm_plan_final_integrity.sql'
      - 'tests/e2e/browser_pm_plan_loop.mjs'
      - 'tests/e2e/local_browser_env.mjs'
      - 'tests/rls/test_local_supabase_pm_*.mjs'
      - '.github/workflows/pm-plan-local-e2e.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: planos-pm-plan-local-${{ github.ref }}
  cancel-in-progress: true

jobs:
  disposable-pm-plan:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      PLANOS_LOCAL_SUPABASE_DIR: /tmp/planos-pm-plan-supabase
      VITE_S1_SERVER_TASKS: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: supabase/setup-cli@45a513f8c64c0bc8e0e3dfe572b5c95be85f6359
        with:
          version: 2.84.2
      - name: Install PostgreSQL client
        run: |
          if ! command -v psql >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -qq -y postgresql-client
          fi
      - name: Refuse hosted credentials
        run: |
          for variable in SUPABASE_ACCESS_TOKEN SUPABASE_DB_URL SUPABASE_DB_PASSWORD; do
            if [ -n "$(printenv "$variable" || true)" ]; then
              echo "::error::Unexpected hosted Supabase configuration"
              exit 1
            fi
          done
      - name: Start disposable local Supabase
        run: |
          set -euo pipefail
          mkdir -p "$PLANOS_LOCAL_SUPABASE_DIR"
          cd "$PLANOS_LOCAL_SUPABASE_DIR"
          supabase init
          if ! supabase start --exclude realtime,storage-api,imgproxy,studio,edge-runtime,logflare,vector,supavisor,postgres-meta,mailpit > /tmp/planos-pm-start.log 2>&1; then
            grep -Ei 'error|failed' /tmp/planos-pm-start.log | head -40 || true
            exit 1
          fi
      - name: Apply repo migrations (excludes local_only)
        env:
          PGHOST: 127.0.0.1
          PGPORT: 54322
          PGUSER: postgres
          PGPASSWORD: postgres
          PGDATABASE: postgres
          PGSSLMODE: disable
        run: |
          set -euo pipefail
          for migration in supabase/migrations/*.sql; do
            psql -X -v ON_ERROR_STOP=1 -f "$migration"
          done
      - name: RLS PM plan review loop
        run: |
          npm ci --ignore-scripts
          node tests/rls/test_local_supabase_pm_plans.mjs
          node tests/rls/test_local_supabase_pm_hardening.mjs
          node tests/rls/test_local_supabase_pm_final.mjs
      - name: Configure Vite for local Supabase
        run: node tests/e2e/local_browser_env.mjs
      - name: Install Playwright Chromium
        run: |
          npm install --ignore-scripts --no-save --package-lock=false playwright@1.58.2
          node node_modules/playwright/cli.js install --with-deps chromium
      - name: Start Vite
        run: |
          (npm run dev -- --host 127.0.0.1 > /tmp/planos-vite-pm.log 2>&1 & echo $! > /tmp/planos-vite-pm.pid)
          for attempt in $(seq 1 50); do
            if curl -fsS -o /dev/null http://127.0.0.1:5173/login; then exit 0; fi
            sleep 1
          done
          tail -n 80 /tmp/planos-vite-pm.log || true
          exit 1
      - name: Playwright PM plan approval loop E2E
        run: node tests/e2e/browser_pm_plan_loop.mjs
      - name: Upload PM plan E2E screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pm-plan-e2e
          path: artifacts/pm-plan-e2e/
          if-no-files-found: warn
      - name: Cleanup
        if: always()
        run: |
          if [ -f /tmp/planos-vite-pm.pid ]; then kill "$(cat /tmp/planos-vite-pm.pid)" || true; fi
          rm -f .env.local
          if [ -d "$PLANOS_LOCAL_SUPABASE_DIR/supabase" ]; then
            ( cd "$PLANOS_LOCAL_SUPABASE_DIR" && supabase stop --no-backup ) || true
          fi
