name: S3 Chromium browser E2E
on:
  pull_request:
    paths:
      - 'src/pages/SpecialistRequestMockPage.tsx'
      - 'src/pages/ProjectAiReviewPage.tsx'
      - 'src/store/projectStore.ts'
      - 'src/lib/mockSpecialistRequest.ts'
      - 'src/lib/specialistReviewHandoff.ts'
      - 'src/lib/ai/MockPlanningReviewProvider.ts'
      - 'src/lib/ai/runPlanningReview.ts'
      - 'src/App.tsx'
      - 'tests/s3-browser-e2e.mjs'
      - '.github/workflows/s3-browser-e2e.yml'
  workflow_dispatch:
jobs:
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: https://placeholder.supabase.co
      VITE_SUPABASE_ANON_KEY: placeholder
      VITE_S3_E2E_FIXTURE: 'true'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm install --no-save playwright
      - run: npx playwright install --with-deps chromium
      - run: npm run build
      - name: Start isolated dev server and run Chromium E2E
        run: |
          npm run dev -- --host 127.0.0.1 > /tmp/planos-e2e-vite.log 2>&1 &
          ready=0
          for i in $(seq 1 45); do
            if curl -fsS http://127.0.0.1:5173/ >/dev/null; then ready=1; break; fi
            sleep 1
          done
          if [ "$ready" != 1 ]; then
            echo 'Vite failed to become ready on :5173'
            cat /tmp/planos-e2e-vite.log || true
            exit 1
          fi
          node tests/s3-browser-e2e.mjs
