name: S3 specialist mock
on:
  pull_request:
    paths:
      - 'src/lib/mockSpecialistRequest.ts'
      - 'src/lib/agentContractTerms.ts'
      - 'src/lib/api/agentContracts.ts'
      - 'src/lib/api/aiRuns.ts'
      - 'src/lib/api/aiArtifacts.ts'
      - 'src/lib/specialistReviewHandoff.ts'
      - 'src/lib/ai/MockPlanningReviewProvider.ts'
      - 'src/lib/ai/runPlanningReview.ts'
      - 'src/lib/ai/reviewJob.ts'
      - 'src/lib/ai/reviewPipeline.ts'
      - 'src/pages/SpecialistRequestMockPage.tsx'
      - 'src/pages/ProjectAiReviewPage.tsx'
      - 'src/pages/ProjectTasksPage.tsx'
      - 'src/App.tsx'
      - 'tests/s3-specialist-request-mock.test.mjs'
      - 'tests/s3-specialist-access-contract.test.mjs'
      - 'tests/agent-contract-terms.test.mjs'
      - 'tests/specialist-review-handoff.test.mjs'
      - 'tests/mock-staff-brief-review.test.mjs'
      - '.github/workflows/s3-specialist-mock.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/s3-specialist-request-mock.test.mjs tests/s3-specialist-access-contract.test.mjs tests/agent-contract-terms.test.mjs tests/specialist-review-handoff.test.mjs tests/mock-staff-brief-review.test.mjs
      - run: npm run build
      - run: ./node_modules/.bin/eslint src/lib/mockSpecialistRequest.ts src/lib/agentContractTerms.ts src/lib/api/agentContracts.ts src/lib/api/aiRuns.ts src/lib/api/aiArtifacts.ts src/lib/specialistReviewHandoff.ts src/lib/ai/MockPlanningReviewProvider.ts src/lib/ai/runPlanningReview.ts src/lib/ai/reviewJob.ts src/lib/ai/reviewPipeline.ts src/pages/SpecialistRequestMockPage.tsx src/pages/ProjectAiReviewPage.tsx src/pages/ProjectTasksPage.tsx src/App.tsx
