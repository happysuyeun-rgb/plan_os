name: Docs archive links
on:
  pull_request:
    paths:
      - 'docs/**'
      - 'README.md'
      - 'scripts/check-document-links.mjs'
      - '.github/workflows/docs-archive-links.yml'
  workflow_dispatch:
jobs:
  links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node scripts/check-document-links.mjs
