name: G1 document conditional save
on:
  pull_request:
    paths:
      - 'src/lib/api/documents.ts'
      - 'tests/document-cas-contract.test.mjs'
      - '.github/workflows/g1-document-cas.yml'
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test tests/document-cas-contract.test.mjs
      - run: npm run build
      - run: npx eslint src/lib/api/documents.ts
