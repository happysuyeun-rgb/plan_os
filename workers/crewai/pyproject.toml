[project]
name = "planos-crewai-worker"
version = "0.1.0"
description = "Isolated CrewAI worker for PlanOS requirements_auditor_v1 (local/disposable only)"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "crewai>=0.119.0,<1.0.0",
  "openai>=1.40.0",
  "httpx>=0.27.0",
  "pydantic>=2.7.0",
  "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
planos-crewai-worker = "planos_crewai.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/planos_crewai"]

[tool.uv]
# Pin transitive resolution away from bleeding-edge Windows breakage.
exclude-newer = "2026-11-01T00:00:00Z"
